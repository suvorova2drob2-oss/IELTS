<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="ctitle cdesc">
  <title id="ctitle">Recycling plans cartoon</title>
  <desc id="cdesc">Man recycles government recycling plans  ironic lead-in cartoon</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fc"/>
      <stop offset="100%" stop-color="#f4efe6"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" fill="url(#sky)"/>
  <!-- Government building -->
  <rect x="40" y="120" width="220" height="160" fill="#64748b" rx="4"/>
  <rect x="70" y="80" width="160" height="50" fill="#475569"/>
  <text x="150" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8fafc">GOVERNMENT</text>
  <rect x="95" y="150" width="30" height="45" fill="#334155"/>
  <rect x="145" y="150" width="30" height="45" fill="#334155"/>
  <rect x="195" y="150" width="30" height="45" fill="#334155"/>
  <!-- Stack of plans -->
  <g transform="translate(320 200)">
    <rect x="0" y="24" width="120" height="14" fill="#cbd5e1" rx="2"/>
    <rect x="4" y="12" width="120" height="14" fill="#e2e8f0" rx="2"/>
    <rect x="8" y="0" width="120" height="14" fill="#fff" stroke="#94a3b8" rx="2"/>
    <text x="68" y="10" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#475569">RECYCLING PLAN</text>
    <text x="68" y="-18" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#64748b">New plans&</text>
  </g>
  <!-- Recycling bin -->
  <g transform="translate(620 240)">
    <path d="M0 80h100v40H0z" fill="#334155"/>
    <path d="M10 80V30h80v50" fill="#475569"/>
    <rect x="20" y="10" width="60" height="22" rx="4" fill="#64748b"/>
    <circle cx="50" cy="-8" r="18" fill="none" stroke="#16a34a" stroke-width="4"/>
    <path d="M38 -8h24M50 -20v24" stroke="#16a34a" stroke-width="3"/>
    <text x="50" y="55" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#86efac">RECYCLE</text>
  </g>
  <!-- Person -->
  <g transform="translate(520 180)">
    <circle cx="0" cy="0" r="22" fill="#fcd9b6"/>
    <rect x="-18" y="22" width="36" height="70" rx="10" fill="#2563eb"/>
    <rect x="-28" y="38" width="56" height="8" fill="#1d4ed8" transform="rotate(-25 -28 38)"/>
    <!-- paper flying to bin -->
    <rect x="42" y="30" width="70" height="48" fill="#fff" stroke="#94a3b8" transform="rotate(12 42 30)"/>
    <text x="77" y="52" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#64748b" transform="rotate(12 77 52)">PLAN</text>
    <path d="M112 54 L580 280" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.5"/>
  </g>
  <text x="450" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="800" fill="#1a2430">Recycling the recycling plans?</text>
  <text x="450" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#64748b">Ironic lead-in � Writing Task 2 � p. 62</text>
  <ellipse cx="450" cy="490" rx="280" ry="8" fill="#000" opacity="0.06"/>
</svg>
